services:
  auth-postgres:
    image: postgres:17-alpine
    container_name: commerceos-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_dev_password
      POSTGRES_DB: commerceos_auth
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerceos_auth"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  auth_postgres_data:
