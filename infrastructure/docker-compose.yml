services:
  auth-postgres:
    image: postgres:17-alpine
    container_name: commerceos-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_dev_password
      POSTGRES_DB: commerceos_auth
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerceos_auth"]
      interval: 5s
      timeout: 3s
      retries: 5

  product-postgres:
    image: postgres:17-alpine
    container_name: commerceos-product-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_dev_password
      POSTGRES_DB: commerceos_product
    ports:
      - "5434:5432"
    volumes:
      - product_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerceos_product"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-postgres:
    image: postgres:17-alpine
    container_name: commerceos-inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_dev_password
      POSTGRES_DB: commerceos_inventory
    ports:
      - "5435:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U commerce -d commerceos_inventory
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth_postgres_data:
  product_postgres_data:
  inventory_postgres_data:
