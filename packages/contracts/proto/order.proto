
syntax = "proto3";

package order;

service OrderService {
  rpc CreateOrder(CreateOrderRequest)
      returns (OrderResponse);

  rpc GetOrder(GetOrderRequest)
      returns (OrderResponse);
}

message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
}

message CreateOrderRequest {
  string user_id = 1;
  repeated OrderItem items = 2;
}

message GetOrderRequest {
  string order_id = 1;
  string user_id = 2;
}

message OrderResponse {
 string id = 1;
 string user_id = 2;
 string status = 3;
 repeated OrderItemResponse items = 4;
 string total_amount = 5;
 string currency = 6;
}

message OrderItemResponse {
 string product_id = 1;
 int32 quantity = 2;
 string unit_price = 3;
 string subtotal = 4;
}
