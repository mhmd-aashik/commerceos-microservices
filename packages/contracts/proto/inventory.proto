
syntax = "proto3";

package inventory;

service InventoryService {
  rpc CheckStock(CheckStockRequest)
      returns (CheckStockResponse);

  rpc ReserveStock(ReserveStockRequest)
      returns (ReserveStockResponse);
}

message CheckStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckStockResponse {
  string product_id = 1;
  int32 requested_quantity = 2;
  int32 available_quantity = 3;
  int32 reserved_quantity = 4;
  bool is_available = 5;
}

message ReserveStockRequest {
  string product_id = 1;
  string order_id = 2;
  int32 quantity = 3;
}

message ReserveStockResponse {
  string reservation_id = 1;
  string product_id = 2;
  string order_id = 3;
  int32 quantity = 4;
  int32 available_quantity = 5;
  int32 reserved_quantity = 6;
  string status = 7;
}
